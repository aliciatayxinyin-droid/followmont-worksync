<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WorkSync | Followmont</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#172b3e;background:#f3f5f8}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px 16px;font-weight:650;background:#e9eef4;color:#18334c}button.primary{background:#ad2036;color:white}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #ec9c37}aside{position:fixed;width:235px;inset:0 auto 0 0;background:#122d44;color:white;padding:24px 16px;display:flex;flex-direction:column;z-index:2}.brand{font-weight:900;letter-spacing:2px;font-size:12px;color:#fff}.brand b{display:block;font-size:24px;letter-spacing:-1px}.brand small{font-weight:400;letter-spacing:0;color:#aebfce}.switch{display:flex;gap:5px;margin:25px 0 16px}.switch button{flex:1;padding:9px 5px;background:#28465d;color:#dce7f0;font-size:12px}.switch .active{background:#b32136;color:white}nav{display:grid;gap:5px}nav button{text-align:left;background:transparent;color:#c4d3df;font-weight:500}nav button.active{background:#304d64;color:white}aside footer{margin-top:auto;color:#aebfce;font-size:11px}main{margin-left:235px;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;background:white;border-bottom:1px solid #e1e6ed;padding:15px 30px;gap:12px}header small,.muted{color:#65768a}.avatar{display:inline-grid;place-items:center;width:40px;height:40px;background:#dce8f3;color:#234a68;border-radius:50%;font-weight:750;flex-shrink:0}.content{max-width:1250px;margin:auto;padding:28px 30px 50px}h1{font-size:29px;letter-spacing:-.8px;margin:0 0 4px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 6px}p{margin:6px 0 12px}.intro{margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.card{background:white;border:1px solid #dfe5ec;border-radius:13px;padding:20px;margin-bottom:16px;box-shadow:0 2px 5px #122d4406;min-width:0}.grid .card{margin:0}.stat b{display:block;font-size:28px;letter-spacing:-1px}.stat small{color:#65768a}.hero{background:#173a55;color:white;border:0}.hero .muted{color:#c1d4e3}.hero button{background:white;color:#173a55}.tag{display:inline-block;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:650;background:#e4f3e9;color:#22613d}.warn{background:#fff0d9;color:#87510c}.neutral{background:#e9eef4;color:#49627a}.line{border-top:1px solid #e5eaf0;padding:13px 0;display:flex;align-items:center;gap:12px;justify-content:space-between}.line:last-child{padding-bottom:0}.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.calendar{display:grid;grid-template-columns:repeat(7,minmax(94px,1fr));gap:7px;min-width:660px}.scroll{overflow:auto}.day{background:#f6f8fb;border:1px solid #e3e9ef;border-radius:8px;min-height:125px;padding:8px;font-size:12px}.day strong{display:block;margin-bottom:8px}.shift{background:#e0ebf7;color:#244a6c;border-left:3px solid #477ca7;padding:7px;border-radius:5px;margin:5px 0}.shift.alt{background:#e5f3e9;border-color:#39825a;color:#245c3e}.shift.hold{background:#fff0d9;border-color:#b77b20;color:#87510c}label{display:block;font-weight:650;margin:14px 0 6px}select,input,textarea{width:100%;padding:11px;border:1px solid #c6d0dc;border-radius:8px;background:white;color:#172b3e}input[type=checkbox]{width:auto}textarea{min-height:85px}.notice{background:#eaf2fa;border-radius:9px;padding:12px;margin:12px 0;color:#234a68}.notice.warn{background:#fff0d9;color:#87510c}.progress{height:7px;border-radius:8px;background:#e7edf3;overflow:hidden;margin:8px 0}.progress span{display:block;height:100%;background:#397d59}.toast{position:fixed;bottom:20px;right:20px;background:#173a55;color:white;padding:14px 20px;border-radius:9px;z-index:5;box-shadow:0 4px 20px #0003}.table{width:100%;border-collapse:collapse;min-width:550px}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #e4e9ef}.table th{font-size:12px;color:#65768a}.link{background:none;color:#245e89;padding:5px}.mobile{display:none}@media(max-width:760px){aside{position:static;width:auto;padding:16px}aside footer{display:none}.brand b{font-size:21px}.switch{margin:12px 0 8px;max-width:350px}nav{display:flex;overflow:auto;gap:5px}nav button{white-space:nowrap;padding:9px 11px;font-size:13px}main{margin:0}header{padding:12px 16px}.content{padding:20px 14px 35px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.card{padding:16px}h1{font-size:25px}.mobile{display:block}.toast{left:12px;right:12px;bottom:12px}.calendar{min-width:660px}}
</style></head><body><aside><div class="brand">FOLLOWMONT <b>WorkSync</b><small>Workforce management</small></div><div class="switch" id="switch"></div><nav id="nav"></nav><footer>STUDENT CONCEPT · V2<br>Fictional workforce data<br><button style="margin-top:10px;font-size:11px" onclick="resetDemo()">Reset demo</button></footer></aside><main><header><div><b>Brisbane depot</b><br><small>Operations workspace · Demo week 16–22 Nov</small></div><div class="row"><span class="avatar" id="avatar">DM</span><div><b id="who"></b><br><small id="whoRole"></small></div></div></header><div class="content" id="content"></div></main><script>
const seed=()=>({people:[{name:'David Morgan',age:58,years:24,role:'Delivery driver',skills:['HC licence','Dispatch','Mentoring','Route planning'],pref:'Current role',hours:'Day shifts',days:[0,1,2,3,4],fatigue:false,licence:'Verified',interest:''},{name:'Sarah Chen',age:56,years:18,role:'Linehaul driver',skills:['MC licence','Linehaul','Mentoring'],pref:'Current role',hours:'Day shifts',days:[0,1,2,3,4],fatigue:false,licence:'Verified',interest:''},{name:'Michael Brown',age:61,years:27,role:'Warehouse coordinator',skills:['Inventory','Dispatch','Team coordination'],pref:'Current role',hours:'Shorter shifts',days:[0,1,2,3,4],fatigue:false,licence:'Not required',interest:''},{name:'Priya Patel',age:42,years:9,role:'Delivery driver',skills:['HC licence','Route planning'],pref:'Current role',hours:'Day shifts',days:[0,1,2,3,4],fatigue:false,licence:'Review due',interest:''},{name:'James Wilson',age:59,years:21,role:'Driver mentor',skills:['HC licence','Mentoring','Training'],pref:'Current role',hours:'Day shifts',days:[0,1,2,3,4],fatigue:false,licence:'Verified',interest:''},{name:'Emily Taylor',age:34,years:6,role:'Dispatch support',skills:['Dispatch','Route planning','Inventory'],pref:'Current role',hours:'Day shifts',days:[0,1,2,3,4],fatigue:false,licence:'Not required',interest:''}],draft:null,published:null,notes:[{i:0,text:'Your roster for 16–22 November is available.'},{i:0,text:'Explore internal opportunities in Career pathways.'}],reviewed:[],log:[]});
let s;try{s=JSON.parse(localStorage.getItem('smartroster-product-v1'))||seed()}catch(e){s=seed()}let mode='employee',page='Overview',employee=0,selected=0,filter='';const days=['Mon 16','Tue 17','Wed 18','Thu 19','Fri 20','Sat 21','Sun 22'];const roles=[{name:'Dispatch support',skill:'Dispatch',desc:'Coordinate deliveries, communicate with drivers and support route planning.',physical:'Low',training:'Dispatch systems induction'},{name:'Driver mentor',skill:'Mentoring',desc:'Coach new drivers and share practical safety knowledge.',physical:'Low–moderate',training:'Mentor induction'},{name:'Warehouse coordinator',skill:'Inventory',desc:'Coordinate inventory and warehouse workflows.',physical:'Moderate',training:'Site-specific induction'}];const menus={employee:['Overview','My roster','Availability','Safety & wellbeing','Career pathways','My profile','Notifications'],manager:['Overview','Team roster','Employees','Smart matching','Safety & compliance','Activity']};const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=n=>n.split(' ').map(x=>x[0]).join('');const p=()=>s.people[employee];function persist(){try{localStorage.setItem('smartroster-product-v1',JSON.stringify(s))}catch(e){}}function toast(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2600)}function go(x){page=x;filter='';render();window.scrollTo(0,0)}function changeMode(x){mode=x;go('Overview')}function resetDemo(){if(confirm('Reset all local demo changes?')){s=seed();persist();employee=0;selected=0;go('Overview')}}function log(t){s.log.unshift(t)}function invalidate(){s.draft=null;persist()}function tag(t,c=''){return '<span class="tag '+c+'">'+esc(t)+'</span>'}function button(t,action,primary=false){return '<button class="'+(primary?'primary':'')+'" onclick="'+action+'">'+t+'</button>'}function title(t,d){return '<div class="intro"><h1>'+t+'</h1><p class="muted">'+d+'</p></div>'}function card(t,c,cls=''){return '<section class="card '+cls+'"><h2>'+t+'</h2>'+c+'</section>'}function stat(n,t){return '<div class="card stat"><b>'+n+'</b><small>'+t+'</small></div>'}function opts(a,v){return a.map(x=>'<option '+(x===v?'selected':'')+'>'+esc(x)+'</option>').join('')}function line(a,b){return '<div class="line"><div class="grow">'+a+'</div>'+b+'</div>'}function note(i,t){s.notes.unshift({i,text:t})}
function match(i){let a=s.people[i],target=a.interest|| (a.pref==='Less physical duties'?'Dispatch support':a.pref==='Mentoring'?'Driver mentor':a.role),r=roles.find(x=>x.name===target),why=[];if(r&&target!==a.role&&!a.skills.includes(r.skill)){why.push('Required skill not verified: '+r.skill);target=a.role}let driving=target.includes('driver')&&!target.includes('mentor');if(a.fatigue)return {i,role:target,hold:true,reason:'Open fatigue report — supervisor review required',days:[],hours:0};if(driving&&(a.licence!=='Verified'||!a.skills.includes(target==='Linehaul driver'?'MC licence':'HC licence')))return {i,role:target,hold:true,reason:'Driving licence requires verification',days:[],hours:0};if(!a.days.length)return {i,role:target,hold:true,reason:'No available days selected',days:[],hours:0};why.push(target===a.role?'Matches existing role and verified skills':'Matches transferable skills and employee career preference');why.push(a.hours+' · '+a.days.length+' available days');return {i,role:target,hold:false,reason:why.join('. '),days:a.days.slice(),hours:a.hours==='Shorter shifts'?4:8}}
function current(i){let a=s.people[i];if(a.fatigue||(a.role==='Delivery driver'||a.role==='Linehaul driver')&&(a.licence!=='Verified'||!a.skills.includes(a.role==='Linehaul driver'?'MC licence':'HC licence')))return {i,role:a.role,hold:true,days:[],hours:0};if(i===s.visitor&&!s.published)return {i,role:a.role,hold:false,days:[],hours:0};return s.published?.[i]?s.published[i]:{i,role:a.role,hold:false,days:[0,1,2,3,4],hours:a.hours==='Shorter shifts'?4:8}}
function calendar(list){return '<div class="scroll"><div class="calendar">'+days.map((d,j)=>'<div class="day"><strong>'+d+'</strong>'+ (list.filter(x=>!x.hold&&x.days.includes(j)).map(x=>'<div class="shift '+(x.role.includes('support')||x.role.includes('mentor')?'alt':'')+'">'+(list.length>1?esc(s.people[x.i].name.split(' ')[0])+'<br>':'')+esc(x.role)+'<br>07:00–'+(x.hours===4?'11:00':'15:00')+'</div>').join('')||'<span class="muted">No shift</span>')+'</div>').join('')+'</div></div>'}
function saveAvailability(){let a=p();a.hours=document.getElementById('hours').value;a.pref=document.getElementById('pref').value;a.days=[...document.querySelectorAll('.daycheck:checked')].map(x=>Number(x.value));a.interest='';invalidate();log(a.name+' updated availability');note(employee,'Your availability has been updated. Changes apply to the next roster review.');persist();go('Overview');toast('Availability saved')}
function report(){let a=p();a.fatigue=true;s.reviewed=s.reviewed.filter(x=>x!==employee);invalidate();log(a.name+' submitted a fatigue report');note(employee,'Fatigue report received. Contact your supervisor before working.');persist();render();toast('Report submitted')}
function requestRole(i){p().interest=roles[i].name;invalidate();log(p().name+' requested '+roles[i].name);note(employee,'Career interest submitted: '+roles[i].name);persist();render();toast('Career interest submitted')}
function generate(){s.draft=s.people.map((_,i)=>match(i));log('Manager generated roster recommendations');persist();go('Smart matching');toast('Recommendations ready')}
function publish(){if(!s.draft||s.draft.some(x=>x.hold))return;s.published=JSON.parse(JSON.stringify(s.draft));s.people.forEach((a,i)=>note(i,'New roster published: '+s.published[i].role));log('Manager published the weekly roster');persist();go('Team roster');toast('Roster published')}
function review(i){if(!confirm('Confirm that a supervisor has assessed this fictional fatigue report and cleared the employee to return to work?'))return;s.people[i].fatigue=false;s.reviewed.push(i);invalidate();note(i,'Supervisor has recorded clearance in this demo.');log('Supervisor reviewed '+s.people[i].name+' fatigue report');persist();render();toast('Review recorded')}
function verify(i){if(!confirm('Confirm that the fictional licence has been checked against the source record?'))return;s.people[i].licence='Verified';invalidate();log('Licence verification recorded for '+s.people[i].name);persist();render();toast('Licence verified')}
function empView(){let a=p(),c=current(employee),n=s.notes.filter(x=>x.i===employee);switch(page){
case 'Overview':return title('Welcome back, '+a.name.split(' ')[0],'Here is your work week at a glance.')+card('Your next shift','<h1>'+esc(c.hold?'Safety review required':c.role)+'</h1><p class="muted">'+(c.hold?'Contact your supervisor before working':c.days.length?days[c.days[0]]+' · 07:00–'+(c.hours===4?'11:00':'15:00'):'No upcoming shifts')+'</p>'+button('View my roster',"go('My roster')"),'hero')+'<div class="stats">'+stat(c.days.length,'Scheduled shifts')+stat(c.days.length*c.hours+'h','Scheduled hours')+stat(a.skills.length,'Verified skills')+stat(n.length,'Notifications')+'</div><div class="grid">'+card('Work preferences','<p>'+esc(a.hours)+' · '+esc(a.pref)+'</p>'+button('Update availability',"go('Availability')"))+card('Your next career step','<p>Explore roles that use your existing experience.</p>'+button('Explore opportunities',"go('Career pathways')"))+card('Safety & wellbeing',tag(a.fatigue?'Report awaiting review':'No open report',a.fatigue?'warn':'')+'<p>Tell us if you are not fit for your next shift.</p>'+button('Open safety centre',"go('Safety & wellbeing')"))+card('Latest notification','<p>'+esc(n[0]?.text||'No notifications')+'</p>'+button('View all',"go('Notifications')"))+'</div>';
case 'My roster':return title('My roster','Your published shifts for the demo week.')+card('16–22 November 2026',calendar([c])+'<p class="muted">Swipe horizontally to see all seven days on mobile.</p>')+card('Weekly summary','<div class="row">'+tag(c.days.length+' shifts','neutral')+tag(c.days.length*c.hours+' hours','neutral')+'</div><p>Availability changes do not automatically alter published shifts. Open fatigue reports place your shifts on hold.</p>');
case 'Availability':return title('Availability & preferences','Tell your manager when and how you prefer to work.')+card('Weekly availability',['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map((d,i)=>'<label><input class="daycheck" type="checkbox" value="'+i+'" '+(a.days.includes(i)?'checked':'')+'> '+d+'</label>').join('')+'<label for="hours">Preferred shift length</label><select id="hours">'+opts(['Day shifts','Shorter shifts','Flexible shifts'],a.hours)+'</select><label for="pref">Preferred duties</label><select id="pref">'+opts(['Current role','Less physical duties','Mentoring'],a.pref)+'</select><p class="muted">Preferences are considered alongside qualifications, safety and staffing needs.</p>'+button('Save availability','saveAvailability()',true)+' '+button('Back to home',"go('Overview')"));
case 'Safety & wellbeing':return title('Safety & wellbeing','Your safety comes before any shift.')+card('Fitness for work',tag(a.fatigue?'Awaiting supervisor review':'No open fatigue report',a.fatigue?'warn':'')+'<p>If you feel fatigued or unable to work safely, submit a report. Your allocation will be placed on hold until a supervisor reviews it.</p>'+(a.fatigue?'<div class="notice warn">Your report is open. Please contact your supervisor.</div>':button('Report fatigue or fitness concern','report()',true)))+card('Privacy','<p>This prototype records only a safety flag, not medical details. In a real deployment, access would be restricted to authorised personnel.</p>');
case 'Career pathways':return title('Career pathways','Find internal opportunities that make use of your experience.')+(a.interest?'<div class="notice">Interest submitted: '+esc(a.interest)+'</div>':'')+'<div class="grid">'+roles.map((r,i)=>card(r.name,tag(a.skills.includes(r.skill)?'Transferable skill verified':'Training or skill verification needed',a.skills.includes(r.skill)?'':'warn')+'<p>'+r.desc+'</p><p><b>Physical demand:</b> '+r.physical+'<br><b>Next step:</b> '+r.training+'</p>'+button(a.interest===r.name?'Interest submitted':'Express interest','requestRole('+i+')',true))).join('')+'</div>';
case 'My profile':return title('My profile','Your experience and verified workforce information.')+card(a.name,'<div class="row"><span class="avatar">'+initials(a.name)+'</span><div><b>'+esc(a.role)+'</b><br>'+a.years+' years of experience · Age '+a.age+'</div></div><label>Skills & qualifications</label>'+a.skills.map(x=>line(esc(x),tag('Verified'))).join('')+line('Driving licence',tag(a.licence,a.licence==='Review due'?'warn':'neutral')))+card('Explore another employee','<p class="muted">Demo only: switch profiles to explore different employee journeys.</p><select aria-label="Employee profile" onchange="employee=Number(this.value);go(\'Overview\')">'+s.people.map((x,i)=>'<option value="'+i+'" '+(i===employee?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>');
case 'Notifications':return title('Notifications','Roster updates and requests.')+card('Inbox',n.map(x=>line(esc(x.text),tag('Update','neutral'))).join('')||'No notifications');}}
function managerView(){let flags=s.people.filter(a=>a.fatigue||a.licence==='Review due').length;switch(page){
case 'Overview':return title('Workforce overview','Plan a safer, more adaptable workforce.')+'<div class="stats">'+stat(s.people.length,'Active employees')+stat(s.people.filter(a=>a.age>=55).length,'Employees aged 55+')+stat(flags,'Compliance alerts')+stat(s.people.filter(a=>a.interest||a.pref!=='Current role').length,'Career / duty requests')+'</div>'+card('Smart planning workspace','<p class="muted">Build a roster around verified skills, employee preferences and safety constraints.</p>'+button('Generate smart roster','generate()',true),'hero')+'<div class="grid">'+card('Safety & compliance','<p>'+flags+' employee records require attention.</p>'+button('Review alerts',"go('Safety & compliance')"))+card('Team roster','<p>'+(s.published?'Updated roster published':'Current roster available')+'</p>'+button('Open weekly roster',"go('Team roster')"))+card('Workforce capability','<p>Explore employee skills, experience and career interests.</p>'+button('View employees',"go('Employees')"))+card('Recent activity','<p>'+esc(s.log[0]||'No changes recorded yet')+'</p>'+button('View activity',"go('Activity')"))+'</div>';
case 'Team roster':return title('Team roster','Brisbane depot · 16–22 November 2026')+card('Published weekly schedule','<div class="row between">'+tag(s.published?'Updated roster':'Initial roster','neutral')+button('Generate new roster','generate()',true)+'</div><br>'+calendar(s.people.map((_,i)=>current(i)))+'<p class="muted">Scroll horizontally to see the full week. Employees with open fatigue reports are excluded from displayed shifts.</p>')+card('Roster totals','<p>'+s.people.map((_,i)=>current(i)).reduce((n,x)=>n+x.days.length*x.hours,0)+' scheduled hours across the team.</p>');
case 'Employees':return title('Employee directory','Explore skills, preferences and individual workforce records.')+card('Team members','<label for="search">Search employees</label><input id="search" placeholder="Name, role or skill" oninput="filter=this.value;renderRows()" value="'+esc(filter)+'"><div class="scroll"><table class="table"><thead><tr><th>Employee</th><th>Role</th><th>Experience</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>')+profileCard(selected);
case 'Smart matching':return title('Smart matching','AI-assisted recommendations with human oversight.')+card('Roster generation','<p>Checks available days, verified skills, licence status, employee preferences and fatigue flags. Age is not a matching criterion.</p>'+button(s.draft?'Regenerate recommendations':'Generate recommendations','generate()',true))+(s.draft?card('Recommended allocations',s.draft.map(x=>line('<b>'+esc(s.people[x.i].name)+'</b><p>'+esc(x.role)+' · '+x.days.length+' shifts / '+x.days.length*x.hours+'h</p><p class="muted">'+esc(x.reason)+'</p>',tag(x.hold?'On hold':'Eligible',x.hold?'warn':''))).join('')+'<div class="notice">Illustrative rule-based matching. Coverage, award conditions and statutory fatigue limits are not fully modelled; a real roster requires additional validation.</div>'+(s.draft.some(x=>x.hold)?'<div class="notice warn">Resolve safety or qualification holds before publishing.</div>'+button('Review compliance',"go('Safety & compliance')"):'<button class="primary" onclick="publish()">Approve & publish roster</button>')):'')+card('How this differs','<p>Beyond shift allocation, WorkSync considers transferable skills and employee-led career transitions to support retention of experienced workers.</p>');
case 'Safety & compliance':return title('Safety & compliance','Review issues before allocating employees to work.')+card('Open alerts',s.people.map((a,i)=>(a.fatigue?line('<b>'+esc(a.name)+'</b><p>Fatigue report · Allocation on hold</p>',button('Record review','review('+i+')')):'')+(a.licence==='Review due'?line('<b>'+esc(a.name)+'</b><p>Driving licence verification due</p>',button('Verify licence','verify('+i+')')):'')).join('')||'<p>No open alerts.</p>')+card('Safety principles','<p>Supervisor clearance is required for fatigue reports. Driving roles require verified licences. Actual deployment must integrate work/rest records and applicable heavy-vehicle rules.</p>');
case 'Activity':return title('Activity log','Changes made during this local demo session.')+card('Recent changes',s.log.map(x=>line(esc(x),tag('Recorded','neutral'))).join('')||'No changes yet.');}}
function profileCard(i){let a=s.people[i];return card('Employee details · '+esc(a.name),'<div class="row"><span class="avatar">'+initials(a.name)+'</span><div><b>'+esc(a.role)+'</b><br>'+a.years+' years of experience · Age '+a.age+'</div></div><p><b>Skills:</b> '+esc(a.skills.join(', '))+'</p><p><b>Preferences:</b> '+esc(a.pref)+' · '+esc(a.hours)+'</p><p><b>Available:</b> '+esc(a.days.map(i=>days[i]).join(', ')||'None')+'</p><p><b>Career interest:</b> '+esc(a.interest||'None')+'</p>'+tag(a.fatigue?'Fatigue review required':a.licence,a.fatigue||a.licence==='Review due'?'warn':'neutral'))}
function renderRows(){let el=document.getElementById('rows');if(!el)return;el.innerHTML=s.people.map((a,i)=>({a,i})).filter(({a})=>[a.name,a.role,...a.skills].join(' ').toLowerCase().includes(filter.toLowerCase())).map(({a,i})=>'<tr><td><button class="link" onclick="selected='+i+';render()">'+esc(a.name)+'</button></td><td>'+esc(a.role)+'</td><td>'+a.years+' years</td><td>'+tag(a.fatigue?'On hold':a.licence==='Review due'?'Review due':'Active',a.fatigue||a.licence==='Review due'?'warn':'')+'</td></tr>').join('')}
function render(){document.getElementById('switch').innerHTML=['employee','manager'].map(x=>'<button class="'+(mode===x?'active':'')+'" onclick="changeMode(\''+x+'\')">'+(x==='employee'?'Employee':'Manager')+'</button>').join('');document.getElementById('nav').innerHTML=menus[mode].map(x=>'<button class="'+(page===x?'active':'')+'" onclick="go(\''+x+'\')">'+x+'</button>').join('');document.getElementById('avatar').textContent=mode==='employee'?initials(p().name):'AM';document.getElementById('who').textContent=mode==='employee'?p().name:'Alex Mitchell';document.getElementById('whoRole').textContent=mode==='employee'?'Employee portal':'Operations manager';document.getElementById('content').innerHTML=(mode==='employee'?empView():managerView())+'<p class="muted" style="margin-top:24px;font-size:12px">Interactive student prototype · Simulated AI · Fictional data · Changes stored only in this browser · Not an official Followmont product.</p><button class="mobile" onclick="resetDemo()">Reset demo</button>';renderRows()}render();
